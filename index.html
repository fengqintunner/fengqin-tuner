<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7F3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="凤琴调音器">
<!-- 核心图标标签 -->
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="shortcut icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>凤琴调音器 · 中式弹拨乐界清流</title>
<style>
:root{
  --paper:#FFFDF8;
  --ink:#1F1D1A;
  --ink-2:#6B6459;
  --ink-3:#9A9184;
  --gold:#B8935A;
  --gold-d:#96723F;
  --line:#E5DCCB;
  --low:#3A6EA5;
  --ok:#4C8C5B;
  --high:#B04A3E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#F7F3EA;
  color:var(--ink);
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","STSong","SimSun","Noto Serif SC",serif;
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(120% 75% at 50% 0%, #FFFCF5 0%, #F7F3EA 45%, #F0E9DA 100%);
}
.app{
  max-width:500px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 26px);
}

/* 微信提示遮罩 */
#wx-mask {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.85); color: #fff; text-align: right; padding: 20px;
  font-family: sans-serif; font-size: 16px; line-height: 1.6;
}
#wx-mask .arrow { font-size: 40px; margin-right: 10px; display: inline-block; animation: bounce 1s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

/* ---------- 品牌区 ---------- */
.brand{text-align:center;padding:2px 0 16px;}
.logo{
  width:56px;height:56px;border-radius:50%;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--gold);
  background:radial-gradient(circle at 32% 26%,#FFFDF6,#F4EAD8);
  color:var(--gold-d);font-size:28px;font-weight:bold;line-height:1;
  box-shadow:0 3px 14px rgba(184,147,90,.20), inset 0 0 0 3px rgba(255,255,255,.62);
}
.brand h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.22em;text-indent:.22em;}
.slogan{margin:7px 0 0;font-size:11.5px;letter-spacing:.34em;text-indent:.34em;color:var(--gold-d);}

/* ---------- 通用块 ---------- */
.block{margin-bottom:11px;}

/* ---------- 基准音 ---------- */
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seg{
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:9px 6px;color:var(--ink-2);font-size:13px;line-height:1.3;
  transition:all .18s;
}
.seg span{display:block;font-size:10.5px;margin-top:3px;opacity:.75;}
.seg.active{
  border-color:var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7EDDA);
  color:var(--ink);box-shadow:0 2px 12px rgba(184,147,90,.16);
}
.seg.active span{color:var(--gold-d);opacity:1;}

/* ---------- 乐器模式 ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mode-btn{
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:9px 3px;font-size:13px;line-height:1.25;color:var(--ink-2);
  transition:all .18s;display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.mode-btn .sub{display:block;font-size:10px;margin-top:2px;opacity:.7;}
.mode-btn.active{
  border-color:var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7EDDA);
  color:var(--ink);box-shadow:0 2px 12px rgba(184,147,90,.16);
}
.mode-btn.active .sub{color:var(--gold-d);opacity:1;}

/* ---------- 定弦说明 ---------- */
.strings-head{font-size:11px;letter-spacing:.14em;color:var(--ink-3);margin:0 0 6px 2px;}
.strings{display:flex;gap:6px;}
.string-card{
  flex:1;min-width:0;text-align:center;border:1px solid var(--line);
  background:var(--paper);border-radius:10px;padding:7px 2px 8px;
  transition:all .18s;
}
.string-card .label{font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;}
.string-card .note{font-size:17px;font-weight:600;line-height:1.15;margin-top:1px;}
.string-card .note .oct{font-size:14px;color:var(--gold-d);}
.string-card.active{
  border-color:var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7EDDA);
  box-shadow:0 3px 12px rgba(184,147,90,.22);transform:translateY(-1px);
}

/* ---------- 拾音面板 ---------- */
.tuner{
  margin-top:14px;padding:20px 18px 18px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,#FFFDF8 0%,#FBF6EB 100%);
  box-shadow:0 8px 28px rgba(120,100,70,.08), inset 0 1px 0 rgba(255,255,255,.9);
  text-align:center;--sc:#C4BAA8;transition:box-shadow .25s;
}
.tuner[data-state="low"]{--sc:var(--low);}
.tuner[data-state="ok"]{--sc:var(--ok);}
.tuner[data-state="high"]{--sc:var(--high);}

.start-btn{
  appearance:none;font-family:inherit;cursor:pointer;border:1px solid var(--gold);
  background:linear-gradient(180deg,#FFFBF1,#F6EBD6);color:var(--gold-d);
  font-size:16px;letter-spacing:.12em;padding:14px 36px;border-radius:999px;
  margin:28px 0 12px;box-shadow:0 4px 16px rgba(184,147,90,.18);transition:transform .15s;
}
.start-btn:active{transform:scale(.97);}
.stop-btn{
  appearance:none;font-family:inherit;cursor:pointer;border:1px solid #b95448;
  background:#f8efed;color:#b95448;
  font-size:16px;letter-spacing:.12em;padding:14px 36px;border-radius:999px;
  margin:28px 0 12px;box-shadow:0 4px 14px rgba(185,84,72,.15);transition:transform .15s;
}
.stop-btn:active{transform:scale(.97);}
.hint{margin:0 0 20px;font-size:11.5px;line-height:1.7;color:var(--ink-3);letter-spacing:.04em;}

.note-display{display:flex;align-items:baseline;justify-content:center;gap:4px;min-height:78px;}
.note-name{font-size:72px;line-height:1;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.note-oct{font-size:54px;line-height:1;font-weight:600;color:var(--gold-d);font-variant-numeric:tabular-nums;}
.freq{font-size:14px;color:var(--ink-2);letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:2px;min-height:20px;}

.meter{margin-top:16px;}
.meter-scale{
  position:relative;height:46px;border-radius:23px;border:1px solid var(--line);
  background:linear-gradient(180deg,#F3ECDD,#F8F3E8);overflow:hidden;
}
.meter-scale::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(31,29,26,.14) 0 1px,transparent 1px 10%);
  opacity:.55;
}
.meter-mid{
  position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;
  border-radius:2px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.9;
}
.meter-needle{
  position:absolute;left:50%;top:4px;bottom:4px;width:4px;margin-left:-2px;border-radius:3px;
  background:var(--sc);box-shadow:0 0 12px var(--sc),0 0 4px rgba(255,255,255,.85);
  transition:left .09s linear,background .2s;
}
.tuner[data-state="ok"] .meter-needle{animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

.meter-legend{
  display:flex;justify-content:space-between;padding:6px 3px 0;font-size:10.5px;
  color:var(--ink-3);letter-spacing:.05em;font-variant-numeric:tabular-nums;
}
.readout{margin-top:10px;display:flex;align-items:baseline;justify-content:center;gap:12px;min-height:32px;}
.cents{font-size:26px;font-weight:600;color:var(--sc);font-variant-numeric:tabular-nums;transition:color .2s;}
.status{font-size:18px;letter-spacing:.06em;color:var(--ink-2);}

.foot{margin-top:26px;text-align:center;font-size:10.5px;letter-spacing:.24em;text-indent:.24em;color:var(--ink-3);}

@media (max-width:360px){
  .note-name{font-size:62px;}
  .note-oct{font-size:46px;}
  .mode-btn{font-size:12px;}
  .seg{font-size:12px;}
  .cents{font-size:22px;}
  .status{font-size:16px;}
}
</style>
</head>
<body>

<!-- 微信内置浏览器提示 -->
<div id="wx-mask">
  <div class="arrow">↗</div>
  <div>请点击右上角 <strong>···</strong><br>选择 <strong>“在 Safari 浏览器中打开”</strong><br>才能正常使用麦克风调音</div>
</div>

<div class="app">
  <header class="brand">
    <div class="logo">凤</div>
    <h1>凤琴调音器</h1>
    <p class="slogan">中式弹拨乐界清流</p>
  </header>

  <section class="block">
    <div class="segmented" id="refGroup">
      <button class="seg active" data-ref="440">A4 = 440Hz<span>国际标准</span></button>
      <button class="seg" data-ref="432">A4 = 432Hz<span>伶伦凤鸣定律猜想</span></button>
    </div>
  </section>

  <section class="block">
    <div class="modes" id="modeGroup"></div>
  </section>

  <section class="block" id="stringsWrap" hidden>
    <div class="strings-head">定弦参考 · 粗弦 → 细弦</div>
    <div class="strings" id="stringsPanel"></div>
  </section>

  <section class="tuner" id="tuner" data-state="idle">
    <div id="gate">
      <button class="start-btn" id="startBtn">开启麦克风</button>
      <p class="hint">需要麦克风授权 · 声音仅在本机处理，不会上传</p>
    </div>
    <div id="live" hidden>
      <button class="stop-btn" id="stopBtn">关闭麦克风</button>
      <div class="note-display">
        <span class="note-name" id="noteName"></span>
        <span class="note-oct" id="noteOct"></span>
      </div>
      <div class="freq" id="freqVal">-- Hz</div>
      <div class="meter">
        <div class="meter-scale">
          <div class="meter-mid"></div>
          <div class="meter-needle" id="needle"></div>
        </div>
        <div class="meter-legend"><span>−50</span><span>0</span><span>+50</span></div>
      </div>
      <div class="readout">
        <span class="cents" id="centsVal">--</span>
        <span class="status" id="statusText">等待拾音…</span>
      </div>
    </div>
  </section>

  <footer class="foot">凤琴 · 千年文脉皆可弦歌</footer>
</div>

<script>
(function () {
  'use strict';

  // 检测是否在微信中打开
  var ua = navigator.userAgent.toLowerCase();
  if (ua.match(/MicroMessenger/i) == "micromessenger") {
    document.getElementById('wx-mask').style.display = 'block';
  }

  var NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var MODES = [
    { id:'free', label:'自由调音', sub:'任意乐器', strings:null },
    { id:'ruan', label:'跨界中阮', sub:'4弦→1弦', strings:[
      { label:'4弦', name:'G', oct:2, midi:43 },
      { label:'3弦', name:'D', oct:3, midi:50 },
      { label:'2弦', name:'G', oct:3, midi:55 },
      { label:'1弦', name:'D', oct:4, midi:62 }
    ]},
    { id:'guitar', label:'国风吉他', sub:'6弦→1弦', strings:[
      { label:'6弦', name:'E', oct:2, midi:40 },
      { label:'5弦', name:'A', oct:2, midi:45 },
      { label:'4弦', name:'D', oct:3, midi:50 },
      { label:'3弦', name:'G', oct:3, midi:55 },
      { label:'2弦', name:'B', oct:3, midi:59 },
      { label:'1弦', name:'E', oct:4, midi:64 }
    ]},
    { id:'ukeH', label:'小批把', sub:'High G', strings:[
      { label:'4弦', name:'G', oct:4, midi:67 },
      { label:'3弦', name:'C', oct:4, midi:60 },
      { label:'2弦', name:'E', oct:4, midi:64 },
      { label:'1弦', name:'A', oct:4, midi:69 }
    ]},
    { id:'ukeL', label:'小批把', sub:'Low G', strings:[
      { label:'4弦', name:'G', oct:3, midi:55 },
      { label:'3弦', name:'C', oct:4, midi:60 },
      { label:'2弦', name:'E', oct:4, midi:64 },
      { label:'1弦', name:'A', oct:4, midi:69 }
    ]}
  ];

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    refGroup: $('refGroup'),
    modeGroup: $('modeGroup'),
    stringsWrap: $('stringsWrap'),
    stringsPanel: $('stringsPanel'),
    tuner: $('tuner'),
    gate: $('gate'),
    live: $('live'),
    startBtn: $('startBtn'),
    stopBtn: $('stopBtn'),
    noteName: $('noteName'),
    noteOct: $('noteOct'),
    freqVal: $('freqVal'),
    needle: $('needle'),
    centsVal: $('centsVal'),
    statusText: $('statusText')
  };

  var state = {
    ref: 440,
    modeId: 'free',
    listening: false,
    activeStringIdx: -1,
    wasListeningBeforeHide: false
  };

  var audioCtx = null;
  var analyser = null;
  var source = null;
  var rafId = null;
  var silenceTimer = 0;
  var mediaStream = null;
  var lastTime = 0;

  function renderModes() {
    el.modeGroup.innerHTML = '';
    MODES.forEach(function (m) {
      var btn = document.createElement('button');
      btn.className = 'mode-btn' + (m.id === state.modeId ? ' active' : '');
      btn.innerHTML = m.label + '<span class="sub">' + m.sub + '</span>';
      btn.onclick = function () {
        state.modeId = m.id;
        renderModes();
        updateStringsUI();
        resetTunerUI();
      };
      el.modeGroup.appendChild(btn);
    });
  }

  function updateStringsUI() {
    var mode = MODES.find(function (m) { return m.id === state.modeId; });
    if (!mode || !mode.strings) {
      el.stringsWrap.hidden = true;
      el.stringsPanel.innerHTML = '';
      return;
    }
    el.stringsWrap.hidden = false;
    el.stringsPanel.innerHTML = '';
    mode.strings.forEach(function (s, i) {
      var card = document.createElement('div');
      card.className = 'string-card';
      card.id = 'str-card-' + i;
      card.innerHTML =
        '<div class="label">' + s.label + '</div>' +
        '<div class="note">' + s.name + '<span class="oct">' + s.oct + '</span></div>';
      el.stringsPanel.appendChild(card);
    });
    highlightString(-1);
  }

  function highlightString(idx) {
    if (state.activeStringIdx === idx) return;
    state.activeStringIdx = idx;
    var cards = el.stringsPanel.children;
    for (var i = 0; i < cards.length; i++) {
      if (i === idx) cards[i].classList.add('active');
      else cards[i].classList.remove('active');
    }
  }

  function resetTunerUI() {
    el.noteName.textContent = '';
    el.noteOct.textContent = '';
    el.freqVal.textContent = '-- Hz';
    el.centsVal.textContent = '--';
    el.statusText.textContent = '等待拾音…';
    el.needle.style.left = '50%';
    el.tuner.dataset.state = 'idle';
    highlightString(-1);
  }

  // 彻底释放麦克风资源
  function stopAudio(keepUI) {
    state.listening = false;
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(function(track) { track.stop(); });
      mediaStream = null;
    }
    if (source) {
      source.disconnect();
      source = null;
    }
    analyser = null;

    if (!keepUI) {
      el.live.hidden = true;
      el.gate.hidden = false;
      el.startBtn.disabled = false;
      el.startBtn.textContent = '开启麦克风';
      resetTunerUI();
    }
  }

  function updateTunerUI(freq) {
    if (!freq) {
      if (Date.now() - silenceTimer > 800) resetTunerUI();
      return;
    }
    var midiFloat = 69 + 12 * Math.log2(freq / state.ref);
    var midiRound = Math.round(midiFloat);
    
    var mode = MODES.find(function (m) { return m.id === state.modeId; });
    var targetMidi = null;
    var targetIdx = -1;
    if (mode && mode.strings) {
      var minDiff = 1.0;
      mode.strings.forEach(function (s, i) {
        var diff = Math.abs(midiFloat - s.midi);
        if (diff < minDiff) {
          minDiff = diff;
          targetMidi = s.midi;
          targetIdx = i;
        }
      });
    }
    var cents = 0;
    var displayMidi = midiRound;
    if (targetMidi !== null) {
      cents = (midiFloat - targetMidi) * 100;
      displayMidi = targetMidi;
      highlightString(targetIdx);
    } else {
      cents = (midiFloat - midiRound) * 100;
      highlightString(-1);
    }
    if (cents > 50) cents = 50;
    if (cents < -50) cents = -50;
    
    var noteName = NOTE_NAMES[displayMidi % 12];
    var octave = Math.floor(displayMidi / 12) - 1;
    el.noteName.textContent = noteName;
    el.noteOct.textContent = octave;
    el.freqVal.textContent = freq.toFixed(2) + ' Hz';
    
    var percent = (cents + 50) / 100 * 100;
    el.needle.style.left = percent + '%';
    
    var stateColor = 'ok';
    var statusStr = '音准';
    if (cents < -5) {
      stateColor = 'low';
      statusStr = '偏低 · 需拧紧';
    } else if (cents > 5) {
      stateColor = 'high';
      statusStr = '偏高 · 需拧松';
    }
    el.tuner.dataset.state = stateColor;
    el.centsVal.textContent = (cents > 0 ? '+' : '') + cents.toFixed(1);
    el.statusText.textContent = statusStr;
    silenceTimer = Date.now();
  }

  function autoCorrelate(buf, sampleRate) {
    var SIZE = buf.length;
    var rms = 0;
    for (var i = 0; i < SIZE; i++) {
      var val = buf[i];
      rms += val * val;
    }
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1;
    
    var r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (var i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
    for (var i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
    
    buf = buf.slice(r1, r2);
    SIZE = buf.length;
    
    var c = new Float32Array(SIZE);
    for (var i = 0; i < SIZE; i++) {
      for (var j = 0; j < SIZE - i; j++) {
        c[i] = c[i] + buf[j] * buf[j + i];
      }
    }
    var d = 0; while (c[d] > c[d + 1]) d++;
    var maxval = -1, maxpos = -1;
    for (var i = d; i < SIZE; i++) {
      if (c[i] > maxval) {
        maxval = c[i];
        maxpos = i;
      }
    }
    var T0 = maxpos;
    var x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
    var a = (x1 + x3 - 2 * x2) / 2;
    var b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);
    
    return sampleRate / T0;
  }

  // 核心：启动麦克风与拾音循环
  async function startAudio(isUserGesture) {
    if (state.listening) return;

    var AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) {
      alert('您的浏览器不支持音频处理，请使用 Safari 浏览器。');
      return;
    }

    // 只有在用户真实点击时，才改变按钮 UI 防止闪烁
    if (isUserGesture) {
      el.startBtn.disabled = true;
      el.startBtn.textContent = '正在启动...';
    }

    try {
      // 1. 如果 audioCtx 存在且被挂起（Safari切后台的默认行为），必须先唤醒
      if (audioCtx && audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      // 2. 如果之前有坏掉的流，先彻底清理
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }

      // 3. 重新申请麦克风
      const stream = await navigator.mediaDevices.getUserMedia({ 
        audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } 
      });
      mediaStream = stream;

      // 4. 初始化或重建 AudioContext 及节点
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      state.listening = true;
      state.wasListeningBeforeHide = true;
      
      // UI 切换
      el.gate.hidden = true;
      el.live.hidden = false;
      resetTunerUI();
      silenceTimer = Date.now();
      
      // 启动拾音帧循环
      if (!rafId) {
        lastTime = 0;
        rafId = requestAnimationFrame(listenLoop);
      }

    } catch (err) {
      console.error('麦克风启动失败:', err);
      
      if (isUserGesture) {
        el.startBtn.disabled = false;
        el.startBtn.textContent = '开启麦克风';
        alert('无法访问麦克风。请确保已授予麦克风权限。');
      } else {
        // 如果是自动恢复失败（切回前台没声音），降级展示恢复按钮
        el.gate.hidden = false;
        el.live.hidden = true;
        el.startBtn.disabled = false;
        el.startBtn.textContent = '点击继续调音';
        // 将按钮的行为改为用户手势触发重连
        el.startBtn.onclick = () => startAudio(true);
      }
    }
  }

  function listenLoop(time) {
    if (!state.listening) return;
    rafId = requestAnimationFrame(listenLoop);
    
    // 控制帧率，避免手机发热（约 20fps）
    if (time - lastTime < 50) return; 
    lastTime = time;

    if (!analyser) return;
    var buffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buffer);
    
    var freq = autoCorrelate(buffer, audioCtx.sampleRate);
    
    if (freq > 60 && freq < 1000) {
      updateTunerUI(freq);
    } else {
      updateTunerUI(null);
    }
  }

  // ========= 处理前后台切换 =========
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      // 切到后台时：记录状态，并立刻暂停 AudioContext 省电，停止麦克风流
      if (state.listening) {
        state.wasListeningBeforeHide = true;
        // 注意：这里不调 stopAudio() 改变 UI，只挂起音频
        if (audioCtx && audioCtx.state === 'running') {
          audioCtx.suspend();
        }
      }
    } else {
      // 切回前台时：如果之前在听，尝试自动恢复
      if (state.wasListeningBeforeHide) {
        // 必须彻底清理旧的媒体流，否则 iOS 拿不到新流
        stopAudio(true); 
        // 尝试非用户手势的自动重连
        startAudio(false); 
      }
    }
  });

  el.refGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('.seg');
    if (!btn) return;
    
    var ref = parseInt(btn.dataset.ref, 10);
    if (ref === state.ref) return;
    
    state.ref = ref;
    var segs = el.refGroup.querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) {
      if (segs[i] === btn) segs[i].classList.add('active');
      else segs[i].classList.remove('active');
    }
    resetTunerUI();
  });

  // 初始化绑定
  el.startBtn.addEventListener('click', () => startAudio(true));
  el.stopBtn.addEventListener('click', () => {
    state.wasListeningBeforeHide = false;
    stopAudio(false);
  });

  renderModes();
  updateStringsUI();
  // ===== 注册 Service Worker 核心代码 =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('ServiceWorker registration successful');
        })
        .catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
    });
  }
})();
</script>
</body>
</html>
