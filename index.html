<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="凤琴调音器">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="shortcut icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>凤琴调音器 · 中式弹拨乐界清流</title>
<style>
:root{
  --paper:#FFFDF8;
  --ink:#1F1D1A;
  --ink-2:#6B6459;
  --ink-3:#9A9184;
  --gold:#B8935A;
  --gold-d:#96723F;
  --line:#E5DCCB;
  --low:#3A6EA5;
  --ok:#4C8C5B;
  --high:#B04A3E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#F7F3EA;
  color:var(--ink);
  font-size:16px;
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","STSong","SimSun","Noto Serif SC",serif;
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(120% 75% at 50% 0%, #FFFCF5 0%, #F7F3EA 45%, #F0E9DA 100%);
}

/* ========== 微信提示遮罩 ========== */
#wx-mask {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.85); color: #fff; text-align: right; padding: 20px;
  font-family: sans-serif; font-size: 16px; line-height: 1.6;
}
#wx-mask .arrow { font-size: 40px; margin-right: 10px; display: inline-block; animation: bounce 1s infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

/* ========== 顶部区域 ========== */
.top-section {
  max-width:600px;
  margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 24px) 16px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.brand h1{
  margin:0;
  font-size:26px;
  font-weight:600;
  letter-spacing:.2em;
  text-indent:.2em;
  text-align:center;
}
.brand .slogan{
  margin:8px 0 0;
  font-size:13px;
  letter-spacing:.25em;
  text-indent:.25em;
  color:var(--gold-d);
  text-align:center;
}

/* 顶部横向排列的基准音选择 */
.top-ref {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  width: 100%;
  max-width: 420px;
}
.seg{
  flex: 1;
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:10px 8px;color:var(--ink-2);font-size:14px;line-height:1.3;
  transition:all .18s;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
}
.seg span{display:block;font-size:12px;opacity:.78;margin-top:2px;}
.seg.active{
  border-color:var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7EDDA);
  color:var(--ink);box-shadow:0 2px 12px rgba(184,147,90,.16);
}
.seg.active span{color:var(--gold-d);opacity:1;}

/* ========== 主布局 ========== */
.app{
  max-width:600px;
  margin:0 auto;
  padding:0 16px calc(env(safe-area-inset-bottom) + 28px);
  display:grid;
  grid-template-columns:48% minmax(0,1fr);
  gap:14px;
  align-items:stretch;
}
.panel{
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(180deg,#FFFDF8 0%,#FBF6EB 100%);
  box-shadow:0 10px 30px rgba(120,100,70,.09), inset 0 1px 0 rgba(255,255,255,.9);
  padding:20px 16px;
}
.panel-left{
  display:flex;flex-direction:column;
}
.panel-right{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* ========== 定弦参考板块 ========== */
#stringsWrap {
  grid-column: 1 / -1;
  padding:14px 16px;
  margin-bottom: 2px;
}
.strings{
  display:flex;
  gap:6px;
  width:100%;
}
.string-card{
  flex:1;
  text-align:center;border:1px solid var(--line);
  background:var(--paper);border-radius:10px;
  padding:6px 2px 7px;
  transition:all .18s;
}
.string-card .label{font-size:11px;color:var(--ink-3);letter-spacing:.04em;}
.string-card .note{font-size:18px;font-weight:600;line-height:1.15;margin-top:1px;}
.string-card .note .oct{font-size:13px;color:var(--gold-d);}
.string-card.active{
  border-color:var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7EDDA);
  box-shadow:0 2px 8px rgba(184,147,90,.22);transform:translateY(-1px);
}

/* ========== 左侧菜单 ========== */
.block{margin-bottom:12px;}
.block:last-child{margin-bottom:0;}

.modes{display:flex;flex-direction:column;gap:10px;}
.mode-btn{
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:14px 10px;font-size:15px;line-height:1.3;color:var(--ink-2);
  transition:all .18s;
  display:flex;justify-content:center;align-items:center;text-align:center;
  font-weight:600;
}
.mode-btn.active{
  border-color:var(--gold);background:linear-gradient(180deg,#FFFBF1,#F7EDDA);
  color:var(--ink);box-shadow:0 2px 12px rgba(184,147,90,.16);
}

/* ========== 右侧：垂直调音器 ========== */
.tuner{
  width:100%;text-align:center;
  --sc:#C4BAA8;transition:box-shadow .25s;
  display:flex;flex-direction:column;align-items:center;
}
.tuner[data-state="low"]{--sc:var(--low);}
.tuner[data-state="ok"]{--sc:var(--ok);}
.tuner[data-state="high"]{--sc:var(--high);}

#gate, #stopWrap { width:100%; text-align:center; }
#gate[hidden], #stopWrap[hidden] { display:none !important; }

.start-btn{
  appearance:none;font-family:inherit;cursor:pointer;border:1px solid var(--gold);
  background:linear-gradient(180deg,#FFFBF1,#F6EBD6);color:var(--gold-d);
  font-size:16px;letter-spacing:.1em;padding:14px 30px;border-radius:999px;
  margin:12px 0 14px;box-shadow:0 4px 16px rgba(184,147,90,.18);transition:transform .15s;
  width:100%;max-width:200px;
}
.start-btn:active{transform:scale(.97);}
.stop-btn{
  appearance:none;font-family:inherit;cursor:pointer;border:1px solid #b95448;
  background:#f8efed;color:#b95448;
  font-size:15px;letter-spacing:.1em;padding:14px 30px;border-radius:999px;
  margin:12px 0 16px;box-shadow:0 4px 14px rgba(185,84,72,.15);transition:transform .15s;
  width:100%;max-width:200px;
}
.stop-btn:active{transform:scale(.97);}

.tuner-body {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.note-display{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:66px;margin-top:10px;}
.note-name{font-size:60px;line-height:1;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.note-oct{font-size:44px;line-height:1;font-weight:600;color:var(--gold-d);font-variant-numeric:tabular-nums;}
.freq{font-size:13.5px;color:var(--ink-2);letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:2px;min-height:20px;}

.meter{
  margin-top:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.meter-scale{
  position:relative;
  width:44px;
  height:200px;
  border-radius:22px;
  border:1px solid var(--line);
  background:linear-gradient(90deg,#F3ECDD,#F8F3E8);
  overflow:hidden;
}
.meter-scale::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(31,29,26,.14) 0 1px,transparent 1px 10%);
  opacity:.55;
}
.meter-mid{
  position:absolute;top:50%;left:5px;right:5px;height:2px;margin-top:-1px;
  border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9;
}
.meter-needle{
  position:absolute;left:4px;right:4px;bottom:50%;height:4px;margin-bottom:-2px;
  border-radius:3px;
  background:var(--sc);box-shadow:0 0 12px var(--sc),0 0 4px rgba(255,255,255,.85);
  transition:bottom .09s linear,background .2s;
}
.tuner[data-state="ok"] .meter-needle{animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

.meter-legend{
  display:flex;flex-direction:column;justify-content:space-between;height:200px;
  font-size:12px;color:var(--ink-3);letter-spacing:.05em;font-variant-numeric:tabular-nums;
  padding:4px 0;
}
.readout{margin-top:16px;display:flex;align-items:baseline;justify-content:center;gap:10px;min-height:30px;}
.cents{font-size:24px;font-weight:600;color:var(--sc);font-variant-numeric:tabular-nums;transition:color .2s;}
.status{font-size:17px;letter-spacing:.06em;color:var(--ink-2);}

/* ========== 页脚 ========== */
.foot{
  grid-column:1 / -1;
  margin-top:10px;text-align:center;font-size:12px;
  letter-spacing:.2em;text-indent:.2em;color:var(--ink-3);
}

/* ========== 极小屏幕微调 ========== */
@media (max-width:360px){
  .top-section { padding: calc(env(safe-area-inset-top) + 16px) 12px 12px; }
  .brand h1 { font-size: 22px; }
  .brand .slogan { font-size: 11.5px; }
  .app{grid-template-columns:46% minmax(0,1fr);gap:10px;padding:0 10px calc(env(safe-area-inset-bottom) + 16px);}
  .panel{padding:14px 10px;border-radius:16px;}
  #stringsWrap{padding:12px 10px; margin-bottom:0;}
  .mode-btn{padding:12px 8px;font-size:14px;}
  .note-name{font-size:50px;}
  .note-oct{font-size:36px;}
  .meter-scale{width:36px;height:180px;}
  .meter-legend{height:180px;}
  .start-btn, .stop-btn{padding:12px 10px;font-size:14px;max-width:160px;}
  .string-card .note {font-size: 16px;}
  .string-card .note .oct {font-size: 12px;}
}
</style>
</head>
<body>

<div id="wx-mask">
  <div class="arrow">↗</div>
  <div>请点击右上角 <strong>···</strong><br>选择 <strong>“在 Safari 浏览器中打开”</strong><br>才能正常使用麦克风调音</div>
</div>

<!-- 顶部区域 -->
<header class="top-section">
  <div class="brand">
    <h1>凤琴调音器</h1>
    <p class="slogan">中式弹拨乐界清流</p>
  </div>
  
  <!-- 基准音选项移至顶部 -->
  <div class="top-ref" id="refGroup">
    <button class="seg active" data-ref="440">
      <span style="font-weight:600;">A4 = 440Hz</span>
      <span>国际标准</span>
    </button>
    <button class="seg" data-ref="432">
      <span style="font-weight:600;">A4 = 432Hz</span>
      <span>伶伦凤鸣定律猜想</span>
    </button>
  </div>
</header>

<div class="app">

  <!-- 置顶：定弦参考 -->
  <div class="panel" id="stringsWrap" hidden>
    <div class="strings" id="stringsPanel"></div>
  </div>

  <!-- 左侧菜单 -->
  <div class="panel panel-left">
    <section class="block">
      <div class="modes" id="modeGroup"></div>
    </section>
  </div>

  <!-- 右侧调音器 -->
  <div class="panel panel-right">
    <section class="tuner" id="tuner" data-state="idle">
      <div id="gate">
        <button class="start-btn" id="startBtn">开启调音</button>
      </div>

      <div id="stopWrap" hidden>
        <button class="stop-btn" id="stopBtn">关闭调音</button>
      </div>

      <div class="tuner-body">
        <div class="note-display">
          <span class="note-name" id="noteName"></span>
          <span class="note-oct" id="noteOct"></span>
        </div>
        <div class="freq" id="freqVal">-- Hz</div>

        <div class="meter">
          <div class="meter-legend">
            <span>+50</span>
            <span>0</span>
            <span>−50</span>
          </div>
          <div class="meter-scale">
            <div class="meter-mid"></div>
            <div class="meter-needle" id="needle"></div>
          </div>
        </div>

        <div class="readout">
          <span class="cents" id="centsVal">--</span>
          <span class="status" id="statusText">等待拾音…</span>
        </div>
      </div>
    </section>
  </div>

  <footer class="foot">凤琴 · 千年文脉皆可弦歌</footer>

</div>

<script>
(function () {
  'use strict';

  var ua = navigator.userAgent.toLowerCase();
  if (ua.match(/MicroMessenger/i) == "micromessenger") {
    document.getElementById('wx-mask').style.display = 'block';
  }

  var NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var MODES = [
    { id:'free', label:'自由调音', strings:null },
    { id:'ruan', label:'跨界中阮', strings:[
      { label:'4弦', name:'G', oct:2, midi:43 },
      { label:'3弦', name:'D', oct:3, midi:50 },
      { label:'2弦', name:'G', oct:3, midi:55 },
      { label:'1弦', name:'D', oct:4, midi:62 }
    ]},
    { id:'guitar', label:'国风吉他', strings:[
      { label:'6弦', name:'E', oct:2, midi:40 },
      { label:'5弦', name:'A', oct:2, midi:45 },
      { label:'4弦', name:'D', oct:3, midi:50 },
      { label:'3弦', name:'G', oct:3, midi:55 },
      { label:'2弦', name:'B', oct:3, midi:59 },
      { label:'1弦', name:'E', oct:4, midi:64 }
    ]},
    { id:'ukeH', label:'小批把 (High G)', strings:[
      { label:'4弦', name:'G', oct:4, midi:67 },
      { label:'3弦', name:'C', oct:4, midi:60 },
      { label:'2弦', name:'E', oct:4, midi:64 },
      { label:'1弦', name:'A', oct:4, midi:69 }
    ]},
    { id:'ukeL', label:'小批把 (Low G)', strings:[
      { label:'4弦', name:'G', oct:3, midi:55 },
      { label:'3弦', name:'C', oct:4, midi:60 },
      { label:'2弦', name:'E', oct:4, midi:64 },
      { label:'1弦', name:'A', oct:4, midi:69 }
    ]}
  ];

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    refGroup: $('refGroup'),
    modeGroup: $('modeGroup'),
    stringsWrap: $('stringsWrap'),
    stringsPanel: $('stringsPanel'),
    tuner: $('tuner'),
    gate: $('gate'),
    stopWrap: $('stopWrap'),
    startBtn: $('startBtn'),
    stopBtn: $('stopBtn'),
    noteName: $('noteName'),
    noteOct: $('noteOct'),
    freqVal: $('freqVal'),
    needle: $('needle'),
    centsVal: $('centsVal'),
    statusText: $('statusText')
  };

  var state = {
    ref: 440,
    modeId: 'free',
    listening: false,
    activeStringIdx: -1,
    wasListeningBeforeHide: false
  };

  var audioCtx = null;
  var analyser = null;
  var source = null;
  var rafId = null;
  var silenceTimer = 0;
  var mediaStream = null;
  var lastTime = 0;

  function renderModes() {
    el.modeGroup.innerHTML = '';
    MODES.forEach(function (m) {
      var btn = document.createElement('button');
      btn.className = 'mode-btn' + (m.id === state.modeId ? ' active' : '');
      btn.textContent = m.label;
      btn.onclick = function () {
        state.modeId = m.id;
        renderModes();
        updateStringsUI();
        resetTunerUI();
      };
      el.modeGroup.appendChild(btn);
    });
  }

  function updateStringsUI() {
    var mode = MODES.find(function (m) { return m.id === state.modeId; });
    if (!mode || !mode.strings) {
      el.stringsWrap.hidden = true;
      el.stringsPanel.innerHTML = '';
      return;
    }
    el.stringsWrap.hidden = false;
    el.stringsPanel.innerHTML = '';
    mode.strings.forEach(function (s, i) {
      var card = document.createElement('div');
      card.className = 'string-card';
      card.id = 'str-card-' + i;
      card.innerHTML =
        '<div class="label">' + s.label + '</div>' +
        '<div class="note">' + s.name + '<span class="oct">' + s.oct + '</span></div>';
      el.stringsPanel.appendChild(card);
    });
    highlightString(-1);
  }

  function highlightString(idx) {
    if (state.activeStringIdx === idx) return;
    state.activeStringIdx = idx;
    var cards = el.stringsPanel.children;
    for (var i = 0; i < cards.length; i++) {
      if (i === idx) cards[i].classList.add('active');
      else cards[i].classList.remove('active');
    }
  }

  function resetTunerUI() {
    el.noteName.textContent = '';
    el.noteOct.textContent = '';
    el.freqVal.textContent = '-- Hz';
    el.centsVal.textContent = '--';
    el.statusText.textContent = '等待拾音…';
    el.needle.style.bottom = '50%';
    el.tuner.dataset.state = 'idle';
    highlightString(-1);
  }

  function stopAudio(keepUI) {
    state.listening = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(function(track) { track.stop(); }); mediaStream = null; }
    if (source) { source.disconnect(); source = null; }
    analyser = null;

    if (!keepUI) {
      el.stopWrap.hidden = true;
      el.gate.hidden = false;
      el.startBtn.disabled = false;
      el.startBtn.textContent = '开启调音';
      resetTunerUI();
    }
  }

  function updateTunerUI(freq) {
    if (!freq) {
      if (Date.now() - silenceTimer > 800) resetTunerUI();
      return;
    }
    var midiFloat = 69 + 12 * Math.log2(freq / state.ref);
    var midiRound = Math.round(midiFloat);

    var mode = MODES.find(function (m) { return m.id === state.modeId; });
    var targetMidi = null;
    var targetIdx = -1;
    if (mode && mode.strings) {
      var minDiff = 1.0;
      mode.strings.forEach(function (s, i) {
        var diff = Math.abs(midiFloat - s.midi);
        if (diff < minDiff) {
          minDiff = diff;
          targetMidi = s.midi;
          targetIdx = i;
        }
      });
    }
    var cents = 0;
    var displayMidi = midiRound;
    if (targetMidi !== null) {
      cents = (midiFloat - targetMidi) * 100;
      displayMidi = targetMidi;
      highlightString(targetIdx);
    } else {
      cents = (midiFloat - midiRound) * 100;
      highlightString(-1);
    }
    if (cents > 50) cents = 50;
    if (cents < -50) cents = -50;

    var noteName = NOTE_NAMES[displayMidi % 12];
    var octave = Math.floor(displayMidi / 12) - 1;
    el.noteName.textContent = noteName;
    el.noteOct.textContent = octave;
    el.freqVal.textContent = freq.toFixed(2) + ' Hz';

    var percent = (cents + 50) / 100 * 100;
    el.needle.style.bottom = percent + '%';

    var stateColor = 'ok';
    var statusStr = '音准';
    if (cents < -5) { stateColor = 'low'; statusStr = '偏低 · 需拧紧'; }
    else if (cents > 5) { stateColor = 'high'; statusStr = '偏高 · 需拧松'; }
    el.tuner.dataset.state = stateColor;
    el.centsVal.textContent = (cents > 0 ? '+' : '') + cents.toFixed(1);
    el.statusText.textContent = statusStr;
    silenceTimer = Date.now();
  }

  function autoCorrelate(buf, sampleRate) {
    var SIZE = buf.length;
    var rms = 0;
    for (var i = 0; i < SIZE; i++) {
      var val = buf[i];
      rms += val * val;
    }
    rms = Math.sqrt(rms / SIZE);

    if (rms < 0.0015) return -1; 

    var r1 = 0, r2 = SIZE - 1;
    var thres = Math.max(0.03, rms * 0.5); 

    for (var i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
    for (var i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

    buf = buf.slice(r1, r2);
    SIZE = buf.length;

    var c = new Float32Array(SIZE);
    for (var i = 0; i < SIZE; i++) {
      for (var j = 0; j < SIZE - i; j++) {
        c[i] = c[i] + buf[j] * buf[j + i];
      }
    }
    var d = 0; while (c[d] > c[d + 1]) d++;
    var maxval = -1, maxpos = -1;
    for (var i = d; i < SIZE; i++) {
      if (c[i] > maxval) {
        maxval = c[i];
        maxpos = i;
      }
    }
    var T0 = maxpos;
    var x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
    var a = (x1 + x3 - 2 * x2) / 2;
    var b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);

    return sampleRate / T0;
  }

  async function startAudio(isUserGesture) {
    if (state.listening) return;

    var AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) {
      alert('您的浏览器不支持音频处理，请使用 Safari 浏览器。');
      return;
    }

    if (isUserGesture) {
      el.startBtn.disabled = true;
      el.startBtn.textContent = '正在启动...';
    }

    try {
      if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

      const stream = await navigator.mediaDevices.getUserMedia({ 
        audio: { 
          echoCancellation: false, 
          autoGainControl: true, 
          noiseSuppression: false 
        } 
      });
      mediaStream = stream;

      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;

      var gainNode = audioCtx.createGain();
      gainNode.gain.value = 3.0; 
      
      source.connect(gainNode);
      gainNode.connect(analyser);

      state.listening = true;
      state.wasListeningBeforeHide = true;
      
      el.gate.hidden = true;
      el.stopWrap.hidden = false;
      resetTunerUI();
      silenceTimer = Date.now();
      
      if (!rafId) {
        lastTime = 0;
        rafId = requestAnimationFrame(listenLoop);
      }

    } catch (err) {
      console.error('麦克风启动失败:', err);
      if (isUserGesture) {
        el.startBtn.disabled = false;
        el.startBtn.textContent = '开启调音';
        alert('无法访问麦克风。请确保已授予麦克风权限。');
      } else {
        el.gate.hidden = false;
        el.stopWrap.hidden = true;
        el.startBtn.disabled = false;
        el.startBtn.textContent = '点击继续调音';
        el.startBtn.onclick = () => startAudio(true);
      }
    }
  }

  function listenLoop(time) {
    if (!state.listening) return;
    rafId = requestAnimationFrame(listenLoop);
    if (time - lastTime < 50) return; 
    lastTime = time;

    if (!analyser) return;
    var buffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buffer);
    
    var freq = autoCorrelate(buffer, audioCtx.sampleRate);
    
    if (freq > 60 && freq < 1000) {
      updateTunerUI(freq);
    } else {
      updateTunerUI(null);
    }
  }

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (state.listening) {
        state.wasListeningBeforeHide = true;
        if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
      }
    } else {
      if (state.wasListeningBeforeHide) { stopAudio(true); startAudio(false); }
    }
  });

  el.refGroup.addEventListener('click', function (e) {
    var btn = e.target.closest('.seg');
    if (!btn) return;
    var ref = parseInt(btn.dataset.ref, 10);
    if (ref === state.ref) return;
    state.ref = ref;
    var segs = el.refGroup.querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) {
      if (segs[i] === btn) segs[i].classList.add('active');
      else segs[i].classList.remove('active');
    }
    resetTunerUI();
  });

  el.startBtn.addEventListener('click', () => startAudio(true));
  el.stopBtn.addEventListener('click', () => {
    state.wasListeningBeforeHide = false;
    stopAudio(false);
  });

  renderModes();
  updateStringsUI();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => { console.log('ServiceWorker registration successful'); })
        .catch(err => { console.log('ServiceWorker registration failed: ', err); });
    });
  }
})();
</script>
</body>
</html>
